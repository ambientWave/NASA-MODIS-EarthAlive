services:
  redis:
    image: redis:7-alpine
    container_name: earth-alive-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: earth-alive-api:dev
    container_name: earth-alive-api
    # --reload watches the bind-mounted ./app directory.
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Earthdata credentials. Missing .env is tolerated; the app then falls back
    # to the netrc strategy and reports auth failures as 503.
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      # Docker Desktop bind mounts do not emit inotify events on Windows/macOS.
      WATCHFILES_FOR_POLLING: "true"
      # conda-forge GDAL with the HDF4 plugin, installed in the image.
      GDAL_TRANSLATE: "/opt/gdal/bin/gdal_translate"
      GDAL_WARP: "/opt/gdal/bin/gdalwarp"
      ANALYSIS_QUEUE_MODE: "redis"
      REDIS_URL: "redis://redis:6379/0"
      # Shared cache for downloaded granules and AOI rasters (bounded LRU).
      ANALYSIS_CACHE_GB: "0.5"
      ANALYSIS_JOB_TIMEOUT: "21600"
    volumes:
      # Live source for uvicorn --reload.
      - ./app:/srv/backend/backend/app
      # Downloaded granules and processed artifacts, shared with the host.
      - ./data:/srv/backend/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: earth-alive-api:dev
    # No fixed container_name: Compose cannot scale a service that pins one.
    # Run `docker compose up -d --scale worker=2` for concurrent jobs.
    # Use the module entry point instead of the `rq` console script: console
    # scripts depend on the pip scripts directory being on PATH, while
    # `python -m` only needs the installed package.
    command: ["python", "-m", "rq.cli", "worker", "--url", "redis://redis:6379/0", "analysis"]
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      GDAL_TRANSLATE: "/opt/gdal/bin/gdal_translate"
      GDAL_WARP: "/opt/gdal/bin/gdalwarp"
      ANALYSIS_QUEUE_MODE: "redis"
      REDIS_URL: "redis://redis:6379/0"
      ANALYSIS_CACHE_GB: "0.5"
      ANALYSIS_JOB_TIMEOUT: "21600"
    volumes:
      - ./app:/srv/backend/backend/app
      - ./data:/srv/backend/data
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # Two workers by default so a download-bound job does not starve a
    # compute-bound one. `docker compose up -d --scale worker=N` overrides it.
    deploy:
      replicas: 2

volumes:
  redis-data:
